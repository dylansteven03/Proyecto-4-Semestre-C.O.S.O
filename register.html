<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Aviaciones el C.O.S.O</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page" style="padding:2rem 1rem;">
    <div class="auth-card" style="max-width:640px;">
      <div class="auth-logo">
        <img src="logo.jpeg" alt="Logo">
        <h2>Aviaciones el C.O.S.O</h2>
      </div>
      <h3>Crear Cuenta de Cliente</h3>
      <form id="registerForm" class="auth-form">
        <div class="register-form-grid">
          <div class="form-group">
            <label for="regIdType">Tipo de Identificación</label>
            <select id="regIdType">
              <option value="cedula">Cédula de Ciudadanía</option>
              <option value="pasaporte">Pasaporte</option>
              <option value="tarjeta">Tarjeta de Extranjería</option>
            </select>
          </div>
          <div class="form-group">
            <label for="regIdNumber">Número de Identificación</label>
            <input type="text" id="regIdNumber" placeholder="Ej: 12345678" required>
          </div>
          <div class="form-group">
            <label for="regFirstName">Nombres</label>
            <input type="text" id="regFirstName" placeholder="Nombres completos" required>
          </div>
          <div class="form-group">
            <label for="regLastName">Apellidos</label>
            <input type="text" id="regLastName" placeholder="Apellidos completos" required>
          </div>
          <div class="form-group">
            <label for="regEmail">Correo Electrónico</label>
            <input type="email" id="regEmail" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="form-group">
            <label for="regPassword">Contraseña</label>
            <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" minlength="6" required>
          </div>
          <div class="form-group full">
            <label for="regAddress">Dirección de Residencia</label>
            <input type="text" id="regAddress" placeholder="Ej: Calle 72 #10-45, Apto 301" required>
          </div>
          <div class="form-group">
            <label for="regCountry">País</label>
            <select id="regCountry"><option value="">-- Seleccione país --</option></select>
          </div>
          <div class="form-group">
            <label for="regDept">Departamento / Estado</label>
            <select id="regDept"><option value="">-- Seleccione departamento --</option></select>
          </div>
          <div class="form-group">
            <label for="regCity">Ciudad</label>
            <select id="regCity"><option value="">-- Seleccione ciudad --</option></select>
          </div>
          <div class="form-group">
            <label for="regPhone1">Teléfono Principal</label>
            <input type="tel" id="regPhone1" placeholder="Ej: 3001234567" required>
          </div>
          <div class="form-group">
            <label for="regPhone2">Teléfono Alterno (opcional)</label>
            <input type="tel" id="regPhone2" placeholder="Ej: 3107654321">
          </div>
        </div>
        <button type="submit" class="btn-auth" style="margin-top:1.25rem;">Crear Cuenta</button>
      </form>
      <div class="auth-links">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a> · <a href="index.html">Volver al inicio</a>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
